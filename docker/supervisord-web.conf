; ============================================================================
; NEXUSDL WEB - Supervisor Configuration
; ============================================================================
; Gère 3 processus dans le conteneur :
;   1. Nginx (reverse proxy, port 80)
;   2. Uvicorn (FastAPI backend, port 8001)
;   3. Next.js (frontend standalone, port 3000)
; ============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

; ============================================================================
; 1. NGINX - Reverse Proxy
; ============================================================================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/nginx-stdout.log
stderr_logfile=/var/log/supervisor/nginx-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ============================================================================
; 2. FASTAPI - Backend API (port interne 8001)
; ============================================================================
[program:fastapi]
command=/usr/local/bin/uvicorn nexusdl.interfaces.web.backend.main:app --host 127.0.0.1 --port 8001 --workers 2 --proxy-headers --forwarded-allow-ips '*'
directory=/app
environment=PYTHONPATH="/app/src:/app",NEXUSDL_ENV="production",PORT="8001"
autostart=true
autorestart=true
priority=20
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/fastapi-stdout.log
stderr_logfile=/var/log/supervisor/fastapi-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

; ============================================================================
; 3. NEXT.JS - Frontend Standalone (port interne 3000)
; ============================================================================
[program:nextjs]
command=/usr/local/bin/node server.js
directory=/app/frontend/standalone
environment=NODE_ENV="production",PORT="3000",HOSTNAME="127.0.0.1"
autostart=true
autorestart=true
priority=30
startsecs=10
startretries=5
stdout_logfile=/var/log/supervisor/nextjs-stdout.log
stderr_logfile=/var/log/supervisor/nextjs-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
